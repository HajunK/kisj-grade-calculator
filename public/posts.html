<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIS Cal</title>
  <link rel="icon" href="icons/logos/page-icon.png" />
  <!-- Sets data-theme/data-hide-breakdown before the stylesheet below
       ever gets a chance to paint — deferred scripts don't run until the
       page has parsed, too late to avoid a flash of the wrong appearance. -->
  <script>
    (function () {
      try {
        var prefs = { appearance: "system", showBreakdown: true, showUpcomingAssessments: true };
        var uid = localStorage.getItem("lastKnownUid");
        var raw = uid ? localStorage.getItem("prefs_" + uid) : null;
        if (!raw) raw = localStorage.getItem("prefs_anon");
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.prefs) prefs = Object.assign(prefs, parsed.prefs);
        }
        var theme = prefs.appearance;
        if (theme === "system") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
        if (prefs.showBreakdown === false) document.documentElement.dataset.hideBreakdown = "true";
        if (prefs.showUpcomingAssessments === false) document.documentElement.dataset.hideUpcomingAssessments = "true";
      } catch (error) {
        // ignore — worst case is the same flash this exists to prevent
      }
    })();
  </script>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <!-- Inter, hosted here (see the @font-face in tokens.css) and fetched
       first, so it's ready by the first paint and pages never flash the
       browser's font on the way in. -->
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/controls.css" />
  <link rel="stylesheet" href="css/floating.css" />
  <link rel="stylesheet" href="css/dialogs.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/my-courses-popup.css" />
  <link rel="stylesheet" href="css/calendar.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/domain.css" />
  <link rel="stylesheet" href="css/domain-scores.css" />
  <link rel="stylesheet" href="css/gpa.css" />
  <link rel="stylesheet" href="css/suggestions.css" />
  <link rel="stylesheet" href="css/grade-protection.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <nav class="tab-bar">
    <img class="tab-bar-logo tab-bar-logo--light" src="icons/logos/light-logo.png" alt="" />
    <img class="tab-bar-logo tab-bar-logo--dark" src="icons/logos/dark-logo.png" alt="" />
    <a class="tab" href="calendar">Calendar</a>
    <a class="tab" href="domain">Domain</a>
    <a class="tab" href="gpa">GPA</a>
    <a class="tab" href="menu">Menu</a>
    <a class="tab tab--admin-only" href="assessments">Assessments</a>
    <a class="tab tab--admin-only tab--active" href="posts">Posts<span class="tab-underline" aria-hidden="true"></span></a>
    <div class="auth-container"></div>
  </nav>
  <!-- Slides the open tab's blue bar in from where the previous page's was.
       Inline, right after the tab bar, so it runs before the page first
       paints: the bar starts at the old tab's place with no flash at the new
       one, and nothing waits on a download. The tab clicked saves where the
       bar is; the next page reads it back and animates the bar from there
       to its own place (transform only, so it stays smooth). -->
  <script>
    (function () {
      var KEY = "tabUnderlineFrom";
      var bar = document.querySelector(".tab--active .tab-underline");
      document.querySelectorAll(".tab-bar .tab").forEach(function (tab) {
        tab.addEventListener("click", function (event) {
          if (!bar || tab.classList.contains("tab--active")) return;
          if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          var rect = bar.getBoundingClientRect();
          try {
            sessionStorage.setItem(KEY, JSON.stringify({ left: rect.left, width: rect.width, at: Date.now() }));
          } catch (error) {}
        });
      });
      var from = null;
      try {
        from = JSON.parse(sessionStorage.getItem(KEY));
        sessionStorage.removeItem(KEY);
      } catch (error) {}
      if (!bar || !from || !bar.animate || Date.now() - from.at > 3000) return;
      if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var to = bar.getBoundingClientRect();
      if (!to.width || !from.width) return;
      bar.animate(
        [
          { transform: "translateX(" + (from.left - to.left) + "px) scaleX(" + from.width / to.width + ")" },
          { transform: "none" },
        ],
        { duration: 300, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" }
      );
    })();
  </script>
  <div class="page-content">
    <p class="admin-not-authorized" id="admin-not-authorized" hidden>
      This page is for admins only.
    </p>

    <div class="admin-day-panel posts-admin-panel" id="posts-layout" hidden>
      <div class="admin-day-panel-header">
        <h2 class="admin-day-panel-title">Posts</h2>
      </div>

      <!-- Shown until the posts collection actually loads. -->
      <div class="assessment-calendar-loading" id="posts-loading">
        <span class="assessment-calendar-spinner"></span>
      </div>

      <p class="posts-empty" id="posts-empty" hidden>Nothing posted yet.</p>

      <ul class="admin-day-entry-list" id="posts-entry-list" hidden></ul>

      <form class="admin-add-form" id="posts-add-form">
        <div class="admin-add-field">
          <span class="admin-add-label">Title</span>
          <input type="text" class="posts-input" id="posts-title-input" autocomplete="off" placeholder="Post title" />
        </div>
        <div class="admin-add-field">
          <span class="admin-add-label">Body</span>
          <textarea class="posts-input posts-textarea" id="posts-body-input" placeholder="What do you want to say?"></textarea>
        </div>
        <div class="admin-add-field">
          <span class="admin-add-label">Link URL (optional)</span>
          <input type="url" class="posts-input" id="posts-link-input" autocomplete="off" placeholder="https://..." />
        </div>
        <button type="submit" class="admin-add-submit-btn">Add Post</button>
      </form>
    </div>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="js/firebase-config.js"></script>
  <script defer src="js/preferences.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/encryption.js"></script>
  <!-- Vendored locally rather than loaded from a CDN — a third-party CDN
       script is exactly what an ad blocker or school network filter
       blocks, which broke this before. A same-origin file can't be. -->
  <script defer src="js/vendor/qrcode-generator.js"></script>
  <script defer src="js/settings-modal.js"></script>
  <script defer src="js/posts-admin.js"></script>
</body>
</html>
