<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIS Cal</title>
  <link rel="icon" href="icons/logos/page-icon.png" />
  <!-- Sets data-theme/data-hide-breakdown before the stylesheet below
       ever gets a chance to paint — deferred scripts don't run until the
       page has parsed, too late to avoid a flash of the wrong appearance. -->
  <script>
    (function () {
      try {
        var prefs = { appearance: "system", showBreakdown: true, showUpcomingAssessments: true };
        var uid = localStorage.getItem("lastKnownUid");
        var raw = uid ? localStorage.getItem("prefs_" + uid) : null;
        if (!raw) raw = localStorage.getItem("prefs_anon");
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.prefs) prefs = Object.assign(prefs, parsed.prefs);
        }
        var theme = prefs.appearance;
        if (theme === "system") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
        if (prefs.showBreakdown === false) document.documentElement.dataset.hideBreakdown = "true";
        if (prefs.showUpcomingAssessments === false) document.documentElement.dataset.hideUpcomingAssessments = "true";
      } catch (error) {
        // ignore — worst case is the same flash this exists to prevent
      }
    })();
  </script>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <!-- Inter, hosted here (see the @font-face in tokens.css) and fetched
       first, so it's ready by the first paint and pages never flash the
       browser's font on the way in. -->

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />

  <link rel="stylesheet" href="css/controls.css" />
  <link rel="stylesheet" href="css/floating.css" />
  <link rel="stylesheet" href="css/dialogs.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/my-courses-popup.css" />
  <link rel="stylesheet" href="css/calendar.css" />

<body class="page-domain">

    <img class="tab-bar-logo tab-bar-logo--dark" src="icons/logos/dark-logo.png" alt="" />

    <a class="tab tab--active" href="domain">Domain<span class="tab-underline" aria-hidden="true"></span></a>
    <a class="tab" href="gpa">GPA</a>
    <a class="tab" href="menu">Menu</a>
    <a class="tab tab--admin-only" href="assessments">Assessments</a>
    <a class="tab tab--admin-only" href="posts">Posts</a>
    <div class="auth-container"></div>
  </nav>
  <!-- Slides the open tab's blue bar in from where the previous page's was.
       Inline, right after the tab bar, so it runs before the page first
       paints: the bar starts at the old tab's place with no flash at the new
       one, and nothing waits on a download. The tab clicked saves where the
       bar is; the next page reads it back and animates the bar from there
       to its own place (transform only, so it stays smooth). -->
  <script>
    (function () {
      var KEY = "tabUnderlineFrom";
      var bar = document.querySelector(".tab--active .tab-underline");
      document.querySelectorAll(".tab-bar .tab").forEach(function (tab) {
        tab.addEventListener("click", function (event) {
          if (!bar || tab.classList.contains("tab--active")) return;
          if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          var rect = bar.getBoundingClientRect();
          try {
            sessionStorage.setItem(KEY, JSON.stringify({ left: rect.left, width: rect.width, at: Date.now() }));
          } catch (error) {}
        });
      });
      var from = null;
      try {
        from = JSON.parse(sessionStorage.getItem(KEY));
        sessionStorage.removeItem(KEY);
      } catch (error) {}
      if (!bar || !from || !bar.animate || Date.now() - from.at > 3000) return;
      if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var to = bar.getBoundingClientRect();
      if (!to.width || !from.width) return;
      bar.animate(
        [
          { transform: "translateX(" + (from.left - to.left) + "px) scaleX(" + from.width / to.width + ")" },
          { transform: "none" },
        ],
        { duration: 300, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" }
      );
    })();
  </script>
  <!-- Visible until initDomainPage actually renders something — in
       practice only a perceptible wait right after signing in with
       nothing cached yet. -->

      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4.5L6.5 10l5.5 5.5" /></svg>
    </button>
    <button type="button" class="domain-card-nav-btn" id="domain-card-next" aria-label="Next class">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4.5l5.5 5.5L8 15.5" /></svg>
    </button>
  </div>

    Your grades are protected. Only you have access.
    <button type="button" class="page-footer-link" id="grade-protection-learn-more-btn">Learn More</button>
  </p>

  <script defer src="js/auth.js"></script>

  <script defer src="js/encryption.js"></script>

  <script defer src="js/settings-modal.js"></script>
  <script defer src="js/shared.js"></script>
  <script defer src="js/assessments-shared.js"></script>

  <script defer src="js/my-courses.js"></script>
  <script defer src="js/domain.js"></script>
  <script defer src="js/class-countdown.js"></script>
  <script defer src="js/boot.js"></script>
</body>
