<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade Calculator</title>
  <link rel="icon" href="icons/logos/page-icon.png" />
  <!-- Sets data-theme/data-hide-breakdown before the stylesheet below
       ever gets a chance to paint — deferred scripts don't run until the
       page has parsed, too late to avoid a flash of the wrong appearance. -->
  <script>
    (function () {
      try {
        var prefs = { appearance: "system", showBreakdown: true, showUpcomingAssessments: true };
        var uid = localStorage.getItem("lastKnownUid");
        var raw = uid ? localStorage.getItem("prefs_" + uid) : null;
        if (!raw) raw = localStorage.getItem("prefs_anon");
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.prefs) prefs = Object.assign(prefs, parsed.prefs);
        }
        var theme = prefs.appearance;
        if (theme === "system") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
        if (prefs.showBreakdown === false) document.documentElement.dataset.hideBreakdown = "true";
        if (prefs.showUpcomingAssessments === false) document.documentElement.dataset.hideUpcomingAssessments = "true";
      } catch (error) {
        // ignore — worst case is the same flash this exists to prevent
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <nav class="tab-bar">
    <img class="tab-bar-logo tab-bar-logo--light" src="icons/logos/light-logo.png" alt="" />
    <img class="tab-bar-logo tab-bar-logo--dark" src="icons/logos/dark-logo.png" alt="" />
    <a class="tab" href="my-courses">Calendar</a>
    <a class="tab" href="domain">Domain</a>
    <a class="tab" href="gpa">GPA</a>
    <a class="tab tab--admin-only tab--active" href="assessments">Assessments</a>
    <a class="tab tab--admin-only" href="suggestions">Suggestions</a>
    <a class="tab tab--admin-only" href="posts">Posts</a>
    <div class="auth-container"></div>
  </nav>
  <div class="page-content">
    <p class="admin-not-authorized" id="admin-not-authorized" hidden>
      This page is for admins only.
    </p>

    <div class="admin-calendar-layout" id="admin-calendar-layout" hidden>
      <div class="assessment-calendar-card">
        <h2 class="assessment-calendar-title">Assessment Calendar</h2>
        <div class="assessment-calendar-header">
          <button type="button" class="assessment-calendar-nav-btn" id="admin-cal-prev" aria-label="Previous month">‹</button>
          <span class="assessment-calendar-label" id="admin-cal-label"></span>
          <button type="button" class="assessment-calendar-nav-btn" id="admin-cal-next" aria-label="Next month">›</button>
        </div>
        <div class="assessment-calendar-weekday-row" id="admin-cal-weekdays"></div>
        <div class="assessment-calendar-grid" id="admin-cal-grid"></div>
      </div>

      <div class="admin-day-panel">
        <div class="admin-day-panel-header">
          <h2 class="admin-day-panel-title" id="admin-day-title">Select a day</h2>
          <div class="admin-day-panel-header-actions">
            <!-- Opens the Bell Schedule popup (see initScheduleModal in
                 assessments-admin.js) — not tied to whichever day happens
                 to be selected, just placed next to the A/B/? toggle. -->
            <button type="button" class="admin-schedule-open-btn" id="admin-schedule-open-btn" aria-label="Bell Schedule">
              <svg class="admin-schedule-open-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
                <path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <!-- Hidden until a day is picked — sets that day's A/B/? type,
                 shown read-only as gray text on each date in the calendar. -->
            <div class="segmented-control" id="admin-day-type-toggle" hidden>
              <button type="button" class="segmented-option" data-value="A">A</button>
              <button type="button" class="segmented-option" data-value="B">B</button>
              <button type="button" class="segmented-option segmented-option--active" data-value="?">?</button>
            </div>
          </div>
        </div>

        <ul class="admin-day-entry-list" id="admin-day-entries"></ul>

        <form class="admin-add-form" id="admin-add-form" hidden>
          <div class="admin-add-field">
            <span class="admin-add-label">Course</span>
            <div class="schedule-field admin-course-field">
              <input class="schedule-input admin-course-input" type="text" autocomplete="off" placeholder="Type a course name" />
              <ul class="schedule-dropdown"></ul>
            </div>
          </div>
          <!-- Only shown once the typed/picked course has divisions. -->
          <div class="admin-add-field" id="admin-division-field" hidden>
            <span class="admin-add-label">Division</span>
            <div class="division-picker" id="admin-division-picker"></div>
          </div>
          <div class="admin-add-field">
            <span class="admin-add-label">Type of Assessment</span>
            <div class="segmented-control" id="admin-type-toggle">
              <button type="button" class="segmented-option segmented-option--active" data-value="In-Class">In-Class</button>
              <button type="button" class="segmented-option" data-value="Testing Block">Testing Block</button>
              <button type="button" class="segmented-option" data-value="Formative">Formative</button>
              <button type="button" class="segmented-option" data-value="Other">Other</button>
              <!-- Only shown while "Other" is the active option. Inside
                   the same segmented-control bar, not a separate box. -->
              <input type="text" class="admin-type-other-input" id="admin-type-other-input" placeholder="Type a label" hidden />
            </div>
          </div>
          <button type="submit" class="admin-add-submit-btn">Add assessment</button>
        </form>
      </div>
    </div>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="js/firebase-config.js"></script>
  <script defer src="js/preferences.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/course-catalog.js"></script>
  <script defer src="js/encryption.js"></script>
  <!-- Vendored locally rather than loaded from a CDN — a third-party CDN
       script is exactly what an ad blocker or school network filter
       blocks, which broke this before. A same-origin file can't be. -->
  <script defer src="js/vendor/qrcode-generator.js"></script>
  <script defer src="js/settings-modal.js"></script>
  <script defer src="js/assessments-admin.js"></script>
</body>
</html>
