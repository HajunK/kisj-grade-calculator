<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade Calculator</title>
  <link rel="icon" href="icons/logos/page-icon.png" />
  <!-- Sets data-theme/data-hide-breakdown before the stylesheet below
       ever gets a chance to paint — deferred scripts don't run until the
       page has parsed, too late to avoid a flash of the wrong appearance. -->
  <script>
    (function () {
      try {
        var prefs = { appearance: "system", showBreakdown: true, showUpcomingAssessments: true };
        var uid = localStorage.getItem("lastKnownUid");
        var raw = uid ? localStorage.getItem("prefs_" + uid) : null;
        if (!raw) raw = localStorage.getItem("prefs_anon");
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.prefs) prefs = Object.assign(prefs, parsed.prefs);
        }
        var theme = prefs.appearance;
        if (theme === "system") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
        if (prefs.showBreakdown === false) document.documentElement.dataset.hideBreakdown = "true";
        if (prefs.showUpcomingAssessments === false) document.documentElement.dataset.hideUpcomingAssessments = "true";
      } catch (error) {
        // ignore — worst case is the same flash this exists to prevent
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/controls.css" />
  <link rel="stylesheet" href="css/floating.css" />
  <link rel="stylesheet" href="css/dialogs.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/my-courses-popup.css" />
  <link rel="stylesheet" href="css/calendar.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/domain.css" />
  <link rel="stylesheet" href="css/domain-scores.css" />
  <link rel="stylesheet" href="css/gpa.css" />
  <link rel="stylesheet" href="css/suggestions.css" />
  <link rel="stylesheet" href="css/grade-protection.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <nav class="tab-bar">
    <img class="tab-bar-logo tab-bar-logo--light" src="icons/logos/light-logo.png" alt="" />
    <img class="tab-bar-logo tab-bar-logo--dark" src="icons/logos/dark-logo.png" alt="" />
    <a class="tab" href="my-courses">Calendar</a>
    <a class="tab" href="domain">Domain</a>
    <a class="tab" href="gpa">GPA</a>
    <a class="tab tab--admin-only" href="assessments">Assessments</a>
    <a class="tab tab--admin-only tab--active" href="suggestions">Suggestions</a>
    <a class="tab tab--admin-only" href="posts">Posts</a>
    <div class="auth-container"></div>
  </nav>
  <div class="page-content">
    <p class="admin-not-authorized" id="admin-not-authorized" hidden>
      This page is for admins only.
    </p>

    <div class="suggestions-card" id="suggestions-layout" hidden>
      <h2 class="suggestions-title">Suggestions</h2>

      <!-- Shown until the suggested collection actually loads. -->
      <div class="assessment-calendar-loading" id="suggestions-loading">
        <span class="assessment-calendar-spinner"></span>
      </div>

      <p class="suggestions-empty" id="suggestions-empty" hidden>Nothing suggested right now.</p>

      <div class="suggestions-list" id="suggestions-list" hidden>
        <div class="suggestions-row suggestions-row--header">
          <span class="suggestions-cell suggestions-cell--date">Date</span>
          <span class="suggestions-cell suggestions-cell--course">Course</span>
          <span class="suggestions-cell suggestions-cell--type">Type</span>
          <span class="suggestions-cell suggestions-cell--count">Count</span>
          <span class="suggestions-cell suggestions-cell--emails">Emails</span>
          <span class="suggestions-cell suggestions-cell--actions"></span>
        </div>
        <div class="suggestions-rows" id="suggestions-rows"></div>
      </div>
    </div>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="js/firebase-config.js"></script>
  <script defer src="js/preferences.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/encryption.js"></script>
  <!-- Vendored locally rather than loaded from a CDN — a third-party CDN
       script is exactly what an ad blocker or school network filter
       blocks, which broke this before. A same-origin file can't be. -->
  <script defer src="js/vendor/qrcode-generator.js"></script>
  <script defer src="js/settings-modal.js"></script>
  <script defer src="js/suggestions-admin.js"></script>
</body>
</html>
