<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade Calculator</title>
  <link rel="icon" href="icons/logos/page-icon.png" />
  <!-- Sets data-theme/data-hide-breakdown before the stylesheet below
       ever gets a chance to paint — deferred scripts don't run until the
       page has parsed, too late to avoid a flash of the wrong appearance. -->
  <script>
    (function () {
      try {
        var prefs = { appearance: "system", showBreakdown: true, showUpcomingAssessments: true };
        var uid = localStorage.getItem("lastKnownUid");
        var raw = uid ? localStorage.getItem("prefs_" + uid) : null;
        if (!raw) raw = localStorage.getItem("prefs_anon");
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.prefs) prefs = Object.assign(prefs, parsed.prefs);
        }
        var theme = prefs.appearance;
        if (theme === "system") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
        if (prefs.showBreakdown === false) document.documentElement.dataset.hideBreakdown = "true";
        if (prefs.showUpcomingAssessments === false) document.documentElement.dataset.hideUpcomingAssessments = "true";
      } catch (error) {
        // ignore — worst case is the same flash this exists to prevent
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <nav class="tab-bar">
    <img class="tab-bar-logo tab-bar-logo--light" src="icons/logos/light-logo.png" alt="" />
    <img class="tab-bar-logo tab-bar-logo--dark" src="icons/logos/dark-logo.png" alt="" />
    <a class="tab tab--active" href="my-courses">My Courses</a>
    <a class="tab" href="domain">Domain</a>
    <a class="tab" href="gpa">GPA</a>
    <a class="tab tab--admin-only" href="assessments">Assessments</a>
    <a class="tab tab--admin-only" href="suggestions">Suggestions</a>
    <div class="auth-container"></div>
  </nav>
  <div class="page-content page-content--flush-bottom">
    <div class="schedule-container">
      <div class="schedule-cards-column">
        <div class="schedule-card">
          <h2 class="schedule-title">A-Day</h2>
          <div class="schedule-row">
            <span class="schedule-label">Period 1</span>
            <button class="show-course-btn" type="button" data-period="0" aria-label="Show hidden course" hidden>
              <img class="show-course-icon" alt="" />
            </button>
            <div class="schedule-field">
              <input class="schedule-input" type="text" autocomplete="off" data-period="0" />
              <button class="schedule-clear-btn" type="button" aria-label="Clear">×</button>
              <ul class="schedule-dropdown"></ul>
            </div>
            <div class="division-picker" hidden></div>
          </div>
          <div class="schedule-row">
            <span class="schedule-label">Period 2</span>
            <button class="show-course-btn" type="button" data-period="1" aria-label="Show hidden course" hidden>
              <img class="show-course-icon" alt="" />
            </button>
            <div class="schedule-field">
              <input class="schedule-input" type="text" autocomplete="off" data-period="1" />
              <button class="schedule-clear-btn" type="button" aria-label="Clear">×</button>
              <ul class="schedule-dropdown"></ul>
            </div>
            <div class="division-picker" hidden></div>
          </div>
          <div class="schedule-row">
            <span class="schedule-label">Period 3</span>
            <button class="show-course-btn" type="button" data-period="2" aria-label="Show hidden course" hidden>
              <img class="show-course-icon" alt="" />
            </button>
            <div class="schedule-field">
              <input class="schedule-input" type="text" autocomplete="off" data-period="2" />
              <button class="schedule-clear-btn" type="button" aria-label="Clear">×</button>
              <ul class="schedule-dropdown"></ul>
            </div>
            <div class="division-picker" hidden></div>
          </div>
          <div class="schedule-row">
            <span class="schedule-label">Period 4</span>
            <button class="show-course-btn" type="button" data-period="3" aria-label="Show hidden course" hidden>
              <img class="show-course-icon" alt="" />
            </button>
            <div class="schedule-field">
              <input class="schedule-input" type="text" autocomplete="off" data-period="3" />
              <button class="schedule-clear-btn" type="button" aria-label="Clear">×</button>
              <ul class="schedule-dropdown"></ul>
            </div>
            <div class="division-picker" hidden></div>
          </div>
        </div>

        <div class="schedule-card">
          <h2 class="schedule-title">B-Day</h2>
          <div class="schedule-row">
            <span class="schedule-label">Period 5</span>
            <button class="show-course-btn" type="button" data-period="4" aria-label="Show hidden course" hidden>
              <img class="show-course-icon" alt="" />
            </button>
            <div class="schedule-field">
              <input class="schedule-input" type="text" autocomplete="off" data-period="4" />
              <button class="schedule-clear-btn" type="button" aria-label="Clear">×</button>
              <ul class="schedule-dropdown"></ul>
            </div>
            <div class="division-picker" hidden></div>
          </div>
          <div class="schedule-row">
            <span class="schedule-label">Period 6</span>
            <button class="show-course-btn" type="button" data-period="5" aria-label="Show hidden course" hidden>
              <img class="show-course-icon" alt="" />
            </button>
            <div class="schedule-field">
              <input class="schedule-input" type="text" autocomplete="off" data-period="5" />
              <button class="schedule-clear-btn" type="button" aria-label="Clear">×</button>
              <ul class="schedule-dropdown"></ul>
            </div>
            <div class="division-picker" hidden></div>
          </div>
          <div class="schedule-row">
            <span class="schedule-label">Period 7</span>
            <button class="show-course-btn" type="button" data-period="6" aria-label="Show hidden course" hidden>
              <img class="show-course-icon" alt="" />
            </button>
            <div class="schedule-field">
              <input class="schedule-input" type="text" autocomplete="off" data-period="6" />
              <button class="schedule-clear-btn" type="button" aria-label="Clear">×</button>
              <ul class="schedule-dropdown"></ul>
            </div>
            <div class="division-picker" hidden></div>
          </div>
          <div class="schedule-row">
            <span class="schedule-label">Period 8</span>
            <button class="show-course-btn" type="button" data-period="7" aria-label="Show hidden course" hidden>
              <img class="show-course-icon" alt="" />
            </button>
            <div class="schedule-field">
              <input class="schedule-input" type="text" autocomplete="off" data-period="7" />
              <button class="schedule-clear-btn" type="button" aria-label="Clear">×</button>
              <ul class="schedule-dropdown"></ul>
            </div>
            <div class="division-picker" hidden></div>
          </div>
        </div>
      </div>

      <!-- Hidden by default and only revealed once at least one period has
           a course typed in — nothing to show a calendar for otherwise. -->
      <div class="assessment-calendar-card my-courses-calendar-card" id="my-courses-calendar-card" hidden>
        <div class="my-courses-calendar-header">
          <h2 class="assessment-calendar-title">Upcoming Assessments</h2>
          <button type="button" class="add-assessment-trigger-btn" id="add-assessment-trigger-btn">
            + Add Missing Assessment
          </button>
        </div>
        <!-- Shown until the assessments collection actually loads — the
             calendar stays hidden until then, rather than showing an
             empty grid first. -->
        <div class="assessment-calendar-loading" id="assessment-cal-loading">
          <span class="assessment-calendar-spinner"></span>
        </div>
        <div class="assessment-calendar-weekday-row assessment-calendar-weekday-row--5col" id="assessment-cal-weekdays" hidden></div>
        <div class="assessment-calendar-weeks" id="assessment-cal-weeks" hidden></div>
      </div>
    </div>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="js/firebase-config.js"></script>
  <script defer src="js/preferences.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/course-catalog.js"></script>
  <script defer src="js/encryption.js"></script>
  <!-- Vendored locally rather than loaded from a CDN — a third-party CDN
       script is exactly what an ad blocker or school network filter
       blocks, which broke this before. A same-origin file can't be. -->
  <script defer src="js/vendor/qrcode-generator.js"></script>
  <script defer src="js/settings-modal.js"></script>
  <script defer src="js/shared.js"></script>
  <script defer src="js/assessments-shared.js"></script>
  <script defer src="js/my-courses.js"></script>
  <script defer src="js/class-countdown.js"></script>
  <script defer src="js/boot.js"></script>
</body>
</html>
